name: safety_ai_app
description: Mobile app for occupational safety with AI elements.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  http: ^1.6.0
  google_mlkit_face_detection: ^0.13.2
  pdf: ^3.12.0
  printing: ^5.14.3

  # For real implementation later:
  # camera: ^0.11.0+2
  # google_mlkit_face_detection: ^0.12.0
  # google_mlkit_image_labeling: ^0.13.0
  # firebase_core: ^3.6.0
  # firebase_messaging: ^15.1.3
  # http: ^1.2.2
  # ar_flutter_plugin_flutterflow: ^0.7.47

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf